<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>White Monster Price Checker</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --fg: #15181e;
      --muted: #6b7280;
      --border: #e5e7eb;
      --row-alt: #f9fafb;
      --accent: #16a34a;
      --accent-hover: #15803d;
      --accent-fg: #ffffff;
      --link: #2563eb;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --cheaper-bg: #ecfdf3;
      --cheaper-border: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card-bg: #1a1d23;
        --fg: #e8eaed;
        --muted: #9aa0a8;
        --border: #2b2f38;
        --row-alt: #20232b;
        --accent: #22c55e;
        --accent-hover: #16a34a;
        --accent-fg: #0b1510;
        --link: #8ab4ff;
        --error: #f87171;
        --error-bg: #2a1616;
        --cheaper-bg: #132a1c;
        --cheaper-border: #22c55e;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 2.5rem 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 700px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.75rem 1.75rem 2rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 0.2rem;
      font-size: 1.4rem;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    #check-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.6rem 1.15rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-fg);
      transition: background 0.15s ease, transform 0.05s ease;
    }
    #check-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #check-btn:active:not(:disabled) { transform: scale(0.98); }
    #check-btn:disabled { opacity: 0.65; cursor: default; }

    .spinner {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: currentcolor;
      display: none;
      animation: spin 0.7s linear infinite;
    }
    #check-btn.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #status {
      margin: 0;
      font-size: 0.88rem;
      color: var(--muted);
    }
    #status.error {
      color: var(--error);
      background: var(--error-bg);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      flex-basis: 100%;
    }

    #checked-summary {
      margin: 0 0 0.9rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    #notices {
      margin: 0 0 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    #notices .notice {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      table-layout: fixed;
    }
    table[hidden] { display: none; }

    thead th {
      text-align: left;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 0 0.6rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    thead th.size-col { width: 16%; }

    tbody tr:nth-child(odd) { background: var(--row-alt); }
    tbody td {
      padding: 0.6rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .size-cell {
      font-weight: 700;
      padding-top: 0.75rem;
    }

    .store-cell.cheaper {
      background: var(--cheaper-bg);
      box-shadow: inset 3px 0 0 var(--cheaper-border);
      border-radius: 4px;
    }

    .store-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      color: #ffffff;
      white-space: nowrap;
      margin-bottom: 0.3rem;
    }
    .store-badge.woolworths { background: #1e8e3e; }
    .store-badge.coles { background: #e2231a; }
    .store-badge.amazon { background: #131921; }

    .product-name {
      display: block;
      margin-bottom: 0.2rem;
      line-height: 1.3;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .price {
      font-weight: 700;
      white-space: nowrap;
    }

    .view-link {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--link);
      text-decoration: none;
      white-space: nowrap;
    }
    .view-link:hover { text-decoration: underline; }

    .not-available {
      color: var(--muted);
      font-style: italic;
      font-size: 0.85rem;
    }

    .muted-row td {
      color: var(--muted);
      font-style: italic;
    }

    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <div class="card">
    <h1>White Monster Price Checker</h1>
    <p class="subtitle">Comparing Monster Energy Ultra prices across Woolworths, Coles, and Amazon, by pack size.</p>

    <div class="controls">
      <button id="check-btn" type="button">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label">Check Prices</span>
      </button>
      <p id="status"></p>
    </div>

    <p id="checked-summary" hidden></p>
    <div id="notices"></div>

    <div class="table-wrap">
      <table id="results" hidden>
        <thead>
          <tr>
            <th class="size-col">Size</th>
            <th>Woolworths</th>
            <th>Coles</th>
            <th>Amazon</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { buildComparisonRows, formatVolumeLabel, storeNotices } from "./compare.js";

    const STORE_LABELS = { woolworths: "Woolworths", coles: "Coles", amazon: "Amazon" };

    const btn = document.getElementById("check-btn");
    const btnLabel = btn.querySelector(".btn-label");
    const status = document.getElementById("status");
    const checkedSummary = document.getElementById("checked-summary");
    const notices = document.getElementById("notices");
    const table = document.getElementById("results");
    const body = document.getElementById("results-body");

    const DEFAULT_LABEL = btnLabel.textContent;

    btn.addEventListener("click", checkPrices);
    loadCachedResults();

    async function loadCachedResults() {
      try {
        const response = await fetch("/api/prices/cached");
        if (!response.ok) return;
        const data = await response.json();
        if (Object.keys(data).length > 0) {
          renderResults(data);
        }
      } catch {
        // Silent - the Check Prices button still works for a live check.
      }
    }

    async function checkPrices() {
      btn.disabled = true;
      btn.classList.add("loading");
      btnLabel.textContent = "Checking…";
      status.textContent = "";
      status.className = "";
      table.hidden = true;
      body.innerHTML = "";
      notices.innerHTML = "";
      checkedSummary.hidden = true;

      try {
        const response = await fetch("/api/prices");
        if (!response.ok) {
          throw new Error("server responded with status " + response.status);
        }
        const data = await response.json();
        renderResults(data);
      } catch (err) {
        status.textContent = "Failed to reach the server: " + err.message;
        status.className = "error";
      } finally {
        btn.disabled = false;
        btn.classList.remove("loading");
        btnLabel.textContent = DEFAULT_LABEL;
      }
    }

    function formatTime(iso) {
      if (!iso) return "";
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", hour12: true });
    }

    function renderResults(data) {
      notices.innerHTML = "";
      for (const message of storeNotices(data)) {
        const p = document.createElement("p");
        p.className = "notice";
        p.textContent = message;
        notices.appendChild(p);
      }

      const checkedParts = Object.keys(STORE_LABELS)
        .map((store) => {
          const result = data[store];
          const time = result && result.status === "ok" ? formatTime(result.checkedAt) : "";
          return time ? `${STORE_LABELS[store]} checked ${time}` : null;
        })
        .filter(Boolean);
      if (checkedParts.length > 0) {
        checkedSummary.textContent = checkedParts.join(" · ");
        checkedSummary.hidden = false;
      } else {
        checkedSummary.hidden = true;
      }

      const rows = buildComparisonRows(data);
      body.innerHTML = "";
      for (const row of rows) {
        body.appendChild(comparisonRow(row));
      }
      table.hidden = rows.length === 0;
    }

    function comparisonRow(row) {
      const tr = document.createElement("tr");

      const sizeTd = document.createElement("td");
      sizeTd.className = "size-cell";
      sizeTd.textContent = row.volumeMl === null ? "Other" : formatVolumeLabel(row.volumeMl);
      tr.appendChild(sizeTd);

      const storeKeys = Object.keys(STORE_LABELS);
      const present = storeKeys.filter((store) => row.stores[store]);
      const minPrice = present.length > 1 ? Math.min(...present.map((store) => row.stores[store].price)) : null;

      for (const store of storeKeys) {
        const product = row.stores[store];
        const isCheaper = minPrice !== null && Boolean(product) && product.price === minPrice;
        tr.appendChild(storeCell(store, product, isCheaper));
      }

      return tr;
    }

    function storeCell(store, product, isCheaper) {
      const td = document.createElement("td");
      td.className = "store-cell" + (isCheaper ? " cheaper" : "");

      if (!product) {
        const span = document.createElement("span");
        span.className = "not-available";
        span.textContent = "not available";
        td.appendChild(span);
        return td;
      }

      const name = document.createElement("span");
      name.className = "product-name";
      name.textContent = product.name;

      const priceRow = document.createElement("div");
      priceRow.className = "price-row";

      const price = document.createElement("span");
      price.className = "price";
      price.textContent = "$" + product.price.toFixed(2);

      const link = document.createElement("a");
      link.href = product.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.className = "view-link";
      link.textContent = "View →";

      priceRow.append(price, link);
      td.append(name, priceRow);
      return td;
    }
  </script>
</body>
</html>
